<div
  class="message-input"
  [class.message-input--inbox]="mode() === 'inbox'"
  [class.message-input--widget]="mode() === 'widget'"
>
  @if (mode() === 'widget') {
    <div class="message-input__input-wrapper message-input__input-wrapper--widget">
      <textarea
        #textarea
        class="message-input__textarea"
        [ngModel]="messageText()"
        (ngModelChange)="messageText.set($event); onInput()"
        (blur)="onBlur()"
        (keydown)="onKeyDown($event)"
        placeholder="Escribe un mensaje..."
        rows="1"
        [disabled]="isSending()"
      ></textarea>
      <button
        type="button"
        class="message-input__send-button"
        (click)="messageText().trim() && sendMessage()"
        [class.message-input__send-button--disabled]="!messageText().trim() || isSending()"
        aria-label="Enviar mensaje"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M3.29106 3.3088C3.00745 3.18938 2.67967 3.25533 2.4643 3.47514C2.24894 3.69495 2.1897 4.02401 2.31488 4.30512L5.40752 11.25H13C13.4142 11.25 13.75 11.5858 13.75 12C13.75 12.4142 13.4142 12.75 13 12.75H5.40754L2.31488 19.6949C2.1897 19.976 2.24894 20.3051 2.4643 20.5249C2.67967 20.7447 3.00745 20.8107 3.29106 20.6912L22.2911 12.6913C22.5692 12.5742 22.75 12.3018 22.75 12C22.75 11.6983 22.5692 11.4259 22.2911 11.3088L3.29106 3.3088Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  }

  @if (mode() === 'inbox') {
    @if (showEmojiPicker()) {
      <div class="message-input__emoji-picker" role="listbox" aria-label="Emojis rápidos">
        @for (emoji of emojis; track emoji) {
          <button
            type="button"
            class="message-input__emoji-option"
            (pointerdown)="onEmojiPointerDown($event, emoji)"
            [attr.aria-label]="'Insertar ' + emoji"
          >
            {{ emoji }}
          </button>
        }
      </div>
    }

    <div class="message-input__input-wrapper message-input__input-wrapper--inbox" data-tour="message-input">
      <textarea
        #textarea
        class="message-input__textarea"
        [ngModel]="messageText()"
        (ngModelChange)="messageText.set($event); onInput()"
        (blur)="onBlur()"
        (keydown)="onKeyDown($event)"
        placeholder="Escribe un mensaje..."
        rows="1"
        [disabled]="isSending()"
      ></textarea>

      <div class="message-input__actions">
        <button
          type="button"
          class="message-input__action-button"
          [class.message-input__action-button--active]="showEmojiPicker()"
          (pointerdown)="toggleEmojiPicker($event)"
          aria-label="Añadir emoji"
          title="Emojis"
          [attr.aria-expanded]="showEmojiPicker()"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
            <line x1="9" y1="9" x2="9.01" y2="9"/>
            <line x1="15" y1="9" x2="15.01" y2="9"/>
          </svg>
        </button>

        <button
          type="button"
          class="message-input__send-button"
          (click)="messageText().trim() && sendMessage()"
          [class.message-input__send-button--disabled]="!messageText().trim() || isSending()"
          aria-label="Enviar mensaje"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M3.29106 3.3088C3.00745 3.18938 2.67967 3.25533 2.4643 3.47514C2.24894 3.69495 2.1897 4.02401 2.31488 4.30512L5.40752 11.25H13C13.4142 11.25 13.75 11.5858 13.75 12C13.75 12.4142 13.4142 12.75 13 12.75H5.40754L2.31488 19.6949C2.1897 19.976 2.24894 20.3051 2.4643 20.5249C2.67967 20.7447 3.00745 20.8107 3.29106 20.6912L22.2911 12.6913C22.5692 12.5742 22.75 12.3018 22.75 12C22.75 11.6983 22.5692 11.4259 22.2911 11.3088L3.29106 3.3088Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  }
</div>
