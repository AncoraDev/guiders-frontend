<div class="captacion-shell" data-testid="captacion-shell">
  <nav class="captacion-tabs" aria-label="Secciones de captación">
    @if (isAdmin()) {
      <a
        class="captacion-tab"
        routerLink="guion"
        routerLinkActive="captacion-tab--active"
        data-testid="captacion-tab-guion"
      >
        Guion
      </a>
    }
    <a
      class="captacion-tab"
      routerLink="leads"
      routerLinkActive="captacion-tab--active"
      data-testid="captacion-tab-leads"
    >
      Leads captados
    </a>
  </nav>

  <router-outlet />
</div>
