<div class="status-selector" data-testid="status-selector">
  <button
    type="button"
    class="status-selector__toggle"
    [class.status-selector__toggle--online]="isOnline()"
    [class.status-selector__toggle--offline]="!isOnline()"
    [disabled]="isUpdating()"
    (click)="togglePresence()"
    [attr.aria-pressed]="isOnline()"
    [attr.aria-label]="
      isOnline()
        ? 'Desconectar: actualmente conectado'
        : 'Conectar: actualmente desconectado'
    "
  >
    <span
      class="status-selector__dot"
      [attr.data-status]="isOnline() ? 'online' : 'offline'"
      aria-hidden="true"
    ></span>
    <span class="status-selector__label">{{ label() }}</span>
    @if (isUpdating()) {
      <span class="status-selector__busy">…</span>
    }
  </button>

  @if (error()) {
    <p class="status-selector__error" role="alert">{{ error() }}</p>
  }
</div>
