<div class="admin-app" [class.embed-mode]="isEmbedMode()">
  @if (!isEmbedMode()) {
    <guiders-sidebar
      [items]="sidebarItems()"
      [config]="sidebarConfig()"
      [userEmail]="currentUser()?.email ?? null"
      [userName]="userName()"
      [avatarUrl]="avatarUrl()"
      [appVersion]="appVersion"
      (itemClick)="onSidebarItemClick($event)"
      (toggleSidebar)="onSidebarToggle($event)"
      (userLogout)="onLogout()"
      (userConfigureAccount)="onConfigureAccount()">
    </guiders-sidebar>
  }

  <div class="admin-main">
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>
  </div>

  <guiders-redirect-confirm></guiders-redirect-confirm>
</div>
